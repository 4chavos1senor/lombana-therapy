<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Lombana Therapy: conoce nuestras terapias, consulta información y agenda tus citas en línea.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de terapia - Lombana Therapy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

 <!-- ENCABEZADO UNIFICADO PARA TODOS LOS MÓDULOS -->
  <header class="header">
    <a href="index.html" class="logo">
      <h1>Lombana Therapy</h1>
    </a>

    <!-- BOTÓN HAMBURGUESA -->
    <button
      type="button"
      class="hamburger-btn"
      id="hamburger-btn"
      aria-label="Abrir menú"
      aria-expanded="false"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav class="nav" id="nav-menu">
      <a href="index.html">Inicio</a>

      <a
        href="mis-citas.html"
        id="btn-mis-citas"
        class="solo-sesion oculto"
      >
        Citas
      </a>

      <div class="dropdown">
        <a href="terapias.html" class="dropdown-btn">Terapias</a>

        <div class="dropdown-content" id="menu-terapias">
          <a href="terapias.html">Cargando terapias...</a>
        </div>
      </div>

      <a href="agendar.html">Agendar terapia</a>
      <a href="index.html#contacto">Contacto</a>
      <a href="index.html#ubicacion">Ubicación</a>

      <a href="login.html" class="solo-invitado">
        Login
      </a>

      <button
        type="button"
        onclick="cerrarSesion()"
        class="btn-logout solo-sesion oculto"
        id="btn-logout"
      >
        Cerrar sesión
      </button>
    </nav>
  </header>

  <!-- FONDO OSCURO MÓVIL -->
  <div class="menu-overlay" id="menu-overlay"></div>

  <main>
    <section class="section detail-section">
      <div class="detail-card detail-card-wide">
        <img
          id="terapia-imagen"
          class="detail-img"
          src="assets/img/terapia-default.jpg"
          alt="Terapia"
          onerror="imagenFallback(this)"
        >

        <div class="detail-content">
          <h2 id="terapia-nombre">Cargando terapia...</h2>
          <p id="terapia-descripcion"></p>
          <p id="terapia-duracion"></p>
          <p id="terapia-precio"></p>

          <a id="btn-agendar-terapia" href="agendar.html" class="btn-primary">
            Agendar terapia
          </a>
        </div>
      </div>
    </section>
  </main>

<script src="js/vendor/supabase.bundle.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/terapias.js"></script>
</body>
</html>
