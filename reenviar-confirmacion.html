
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Confirmar correo | Lombana Therapy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <main class="form-section">
    <form class="form-card" id="form-confirmacion">
      <h1>Lombana Therapy</h1>
      <h2>Verificación de correo</h2>

      <p>
        Si te registraste con correo y contraseña y aún no
        confirmaste tu cuenta, puedes solicitar otro enlace.
      </p>
      <p>
        Si accediste con Google, generalmente no necesitas
        este correo de confirmación adicional.
      </p>

      <label for="correo">Correo electrónico</label>
      <input
        type="email"
        id="correo"
        autocomplete="email"
        required
      >

      <!-- Compatible con el CAPTCHA obligatorio de Supabase Auth. -->
      <div id="contenedor-captcha" hidden></div>
      <p id="mensaje-captcha" role="status" aria-live="polite" hidden></p>

      <button type="submit" class="btn-primary"
              id="btn-reenviar">
        Reenviar confirmación
      </button>

      <p id="mensaje" role="status"
         aria-live="polite"></p>

      <p>
        <a href="login.html">
          Volver a iniciar sesión
        </a>
      </p>
    </form>
  </main>

  <script src="js/vendor/supabase.bundle.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/session-timeout.js"></script>
  <script src="js/turnstile.js"></script>

  <script>
    const form = document.getElementById(
      'form-confirmacion'
    );

    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      const correo = document.getElementById(
        'correo'
      ).value.trim();

      const boton = document.getElementById(
        'btn-reenviar'
      );

      const mensaje = document.getElementById(
        'mensaje'
      );

      const captcha = window.LombanaTurnstile;
      const captchaActivo = captcha?.estaActivo?.() === true;
      const captchaToken = captchaActivo ? captcha.obtenerToken() : null;

      if (captchaActivo && !captchaToken) {
        mensaje.textContent = 'Completa la verificación de seguridad para continuar.';
        return;
      }

      boton.disabled = true;
      mensaje.textContent = 'Procesando solicitud...';

      try {
        const { error } = await supabaseClient.auth.resend({
          type: 'signup',
          email: correo,
          options: {
            emailRedirectTo: new URL(
              'login.html',
              window.location.href
            ).href,
            ...(captchaActivo ? { captchaToken } : {})
          }
        });

        if (error) {
          throw error;
        }

        // La solicitud aceptada NO garantiza entrega, ni que la cuenta
        // esté pendiente: Supabase evita revelar la existencia de usuarios.
        mensaje.textContent =
          'Solicitud recibida. Si existe una cuenta registrada con ' +
          'correo y contraseña pendiente de confirmación, revisa tu ' +
          'bandeja de entrada y correo no deseado. El envío depende ' +
          'de la configuración de correo del servidor.';
      } catch (error) {
        const codigo = String(error?.code || '').toLowerCase();
        const status = Number(error?.status || 0);

        // No imprimir correos ni información sensible en consola.
        console.warn('Reenvío de confirmación fallido:', codigo, status);

        if (codigo === 'email_address_not_authorized' ||
            codigo === 'email_not_authorized') {
          mensaje.textContent =
            'El servicio de correo todavía no admite esta dirección. ' +
            'Contacta a Lombana Therapy para solicitar ayuda.';
        } else if (status === 429 ||
                   codigo === 'over_email_send_rate_limit' ||
                   codigo === 'over_request_rate_limit') {
          mensaje.textContent =
            'Se alcanzó el límite temporal de envíos. ' +
            'Espera antes de solicitar otro correo.';
        } else {
          mensaje.textContent =
            'No se pudo enviar la solicitud de confirmación. ' +
            'Inténtalo más tarde o contacta a Lombana Therapy.';
        }
      } finally {
        if (captchaActivo) captcha.reiniciar();
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
