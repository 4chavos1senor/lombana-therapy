
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Página no encontrada en Lombana Therapy."
  >

  <title>Página no encontrada - Lombana Therapy</title>

  <link rel="stylesheet" href="css/styles.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      background-color: #f7f4ef;
      text-align: center;
    }

    .error-content {
      background: #ffffff;
      padding: 50px 35px;
      border-radius: 16px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .error-code {
      font-size: 90px;
      color: #6b4f3f;
      margin-bottom: 15px;
    }

    .error-content h1 {
      color: #6b4f3f;
      margin-bottom: 20px;
    }

    .error-content p {
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .error-content .btn-primary {
      display: inline-block;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="error-page">

    <div class="error-content">

      <div class="error-code" aria-hidden="true">
        404
      </div>

      <h1>Página no encontrada</h1>

      <p>
        Lo sentimos, la página que estás buscando
        no existe o ha cambiado de dirección.
      </p>

      <a href="/index.html" class="btn-primary">
        Volver al inicio
      </a>

    </div>

  </main>

</body>
</html>
